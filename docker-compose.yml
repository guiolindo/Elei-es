services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apuracao
      POSTGRES_PASSWORD: apuracao
      POSTGRES_DB: apuracao
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuracao"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://apuracao:apuracao@postgres:5432/apuracao
      POLL_INTERVAL_SECONDS: 20
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./static:/app/static
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: {}
