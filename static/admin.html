<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Modo admin · Apuração 2026</title>
<link rel="stylesheet" href="/static/app.css" />
<style>
  body { padding: 24px 16px; max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  form { display: grid; gap: 10px; }
  input { padding: 12px; min-height: 48px; font: inherit; border-radius: 10px; border: 1px solid #3a4866; background: #0d1424; color: #fff; }
  button { min-height: 48px; border: 0; border-radius: 10px; font: 700 15px Inter, sans-serif; cursor: pointer; background: #f0b429; color: #17130b; }
  button.sec { background: #1c2740; color: #fff; }
  .msg { min-height: 22px; font-size: 14px; margin-top: 12px; }
  .ok { color: #22c55e; } .erro { color: #ff6b72; }
  a { color: #f0b429; }
</style>
</head>
<body>
<h1>Modo admin</h1>
<p class="sub">Com o token, este navegador mostra a estimativa e a chance de vencer desde o primeiro boletim, sem esperar 10%, 30% ou 50% apurado. Vale por 24 horas e só neste aparelho; os visitantes continuam vendo o site normal.</p>
<form id="f">
  <input id="t" type="password" placeholder="Token de admin" autocomplete="current-password" required>
  <button type="submit">Ativar por 24 horas</button>
  <button type="button" class="sec" id="sair">Desativar neste aparelho</button>
</form>
<p class="msg" id="msg"></p>
<p class="sub" id="estado"></p>
<p class="sub"><a href="/">Voltar à apuração</a></p>
<script>
const CHAVE = "elei-es:admin";
function estado() {
  let a = null;
  try { a = JSON.parse(localStorage.getItem(CHAVE) || "null"); } catch (e) {}
  const el = document.getElementById("estado");
  if (a && a.ate > Date.now()) {
    el.textContent = "Ativo até " + new Date(a.ate).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" }) + " (horário de Brasília).";
  } else el.textContent = "Desativado neste aparelho.";
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = document.getElementById("t").value.trim();
  const msg = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "Conferindo…";
  try {
    const r = await fetch("/api/admin/status", { headers: { "X-Admin-Token": token }, cache: "no-store" });
    if (!r.ok) throw new Error();
    localStorage.setItem(CHAVE, JSON.stringify({ token, ate: Date.now() + 24 * 3600 * 1000 }));
    msg.className = "msg ok"; msg.textContent = "Modo admin ativo. Abrindo a apuração…";
    setTimeout(() => { location.href = "/"; }, 900);
  } catch (err) {
    msg.className = "msg erro"; msg.textContent = "Token inválido.";
  }
  estado();
});
document.getElementById("sair").addEventListener("click", () => {
  try { localStorage.removeItem(CHAVE); } catch (e) {}
  const msg = document.getElementById("msg");
  msg.className = "msg ok"; msg.textContent = "Modo admin desativado neste aparelho.";
  estado();
});
estado();
</script>
</body>
</html>
