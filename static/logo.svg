<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Apuração 2026">
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Círculo de fundo (símbolo de "totalização") -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="url(#lg2)" stroke-width="2" opacity="0.35"/>
  <!-- Arco de "progresso" 3/4 (referência: apuração em andamento) -->
  <path d="M 20 3 A 17 17 0 1 1 3 20" fill="none" stroke="url(#lg1)" stroke-width="3" stroke-linecap="round"/>
  <!-- Barras verticais crescentes (gráfico de votos) -->
  <rect x="11" y="22" width="3.4" height="8" rx="1" fill="url(#lg2)"/>
  <rect x="16.5" y="17" width="3.4" height="13" rx="1" fill="url(#lg1)"/>
  <rect x="22" y="13" width="3.4" height="17" rx="1" fill="url(#lg1)"/>
  <rect x="27.5" y="19" width="3.4" height="11" rx="1" fill="url(#lg2)"/>
</svg>
