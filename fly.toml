app = "elei-es"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  # A DATABASE_URL vem de fly secrets (configurada com o public URL do Postgres do Railway)
  # As demais podem ser sobrepostas com fly secrets.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/cargos"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
